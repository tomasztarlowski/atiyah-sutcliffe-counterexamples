version: "v0.4"

project:
  name: "Counterexamples and Holomorphic No-Go Rigidity for the Euclidean, Hyperbolic, and Symplectic Atiyah–Sutcliffe Conjectures"
  description: >-
    Lean 4 and Mathlib formalization refuting the classical Euclidean, hyperbolic, symplectic Sp(m),
    and orthogonal SO(2m+1) Atiyah–Sutcliffe conjectures and establishing universal SU(2) x S_m
    holomorphic spinor No-Go rigidity via explicit integer witnesses, continuous homotopies,
    z-rotation and antipodal parity block Schur reductions, Schur–Weyl representation theory, and
    kernel-checked fixed-point interval arithmetic (zero sorry, zero admit, zero native_decide,
    standard axioms {propext, Quot.sound, Classical.choice} only). Establishes: (1) Euclidean and
    hyperbolic C3 refutations at minimal n = 5 (planar C3 failure first announced by Tan–Zhang, Oct
    2026) alongside the exact n = 3 5-gap positivity theorem D_3^H > 1; (2) lowered planar C1/C2
    disproofs down to n = 35 (-1 < D_35 < 0 and IVT zero D_35 = 0, alongside n = 57, 63) in R^2
    and H^2, plus non-coplanar n = 37 (-1 < D_37 < 0 in R^3, H^3); (3) strictly non-coplanar 3D
    and H^3 C1/C2 disproofs at n = 26 (D_26 = 0, D_26^H = 0, and -1 < D_26^H < 0, alongside coaxial
    n = 36 and mirror-pair n = 59); (4) Sp(20) (planar, 2m = 40), non-coplanar 3D Sp(18) (2m = 36),
    and non-coplanar B_18 = SO(37) (n = 37, including 36 non-origin linear dependence) C1/C2
    refutations; and (5) universal SU(2) x S_m multilinear spinor polynomial rigidity and
    unconditional weighted multi-body No-Go theorems at n = 26 (R^3), n = 35 (R^2), and n = 36 (Sp(18)).
  authors:
    - "Tomasz Tarłowski"
  responsible_maintainers:
    - "Tomasz Tarłowski"
  license: "Apache-2.0"
  repository_url: "https://github.com/tomasztarlowski/atiyah-sutcliffe-counterexamples"

classification:
  arxiv: ["math.MG", "math-ph", "cs.LO"]
  msc2020: ["51M15", "70G45", "22E46", "81Q70", "68V20"]

