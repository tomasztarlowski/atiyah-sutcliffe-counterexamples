    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/azakhtyamov/atiyah-sutcliffe-disproof"
    relationship: "independent"
    note: >-
      Independent Lean 4 formalization of Euclidean C1 at n = 46 using unnormalized determinants;
      this repository formalizes normalized D_n, lowers 3D C1/C2 to n = 36 and n = 26, planar to n = 35,
      adds Lean 4 C3 proofs at n = 5, hyperbolic H^3 disproofs down to n = 26, Sp(m)/B_18 refutations,
      and universal SU(2) x S_m No-Go theorems.

status:
  scope: >-
    Formalized unconditionally: Euclidean C3 refutation (n = 5 planar & 3D), Euclidean C1 & C2
    refutations (planar n = 35, 57, 63; non-coplanar 3D n = 26, 36, 37, 59), Hyperbolic H^2/H^3
    refutations of C3 (n = 5) and C1/C2 (planar n = 35, 57; non-coplanar n = 26, 37, 59), H^3
    n = 3 5-gap positivity (D_3^H > 1), Sp(20)/Sp(18)/B_18 disproofs, and SU(2) x S_m No-Go
    rigidity. Exact minimal C1/C2 threshold in 6 <= n <= 25 remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

