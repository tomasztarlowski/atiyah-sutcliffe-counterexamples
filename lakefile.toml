name = "atiyah_sutcliffe_counterexamples"
version = "0.1.0"
keywords = ["math", "lean4", "geometry", "atiyah-sutcliffe", "mathematical-physics"]
defaultTargets = ["Matematyka", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "Matematyka"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
